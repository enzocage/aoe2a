<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Imperium der Zeitalter – AoE II RTS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c0a08;
            font-family: 'Inter', sans-serif;
            color: #fef3c7;
        }

        .font-medieval {
            font-family: 'Cinzel', serif;
        }

        #gameCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            z-index: 1;
        }

        .medieval-panel {
            background: linear-gradient(180deg, rgba(36, 26, 18, 0.95) 0%, rgba(20, 14, 10, 0.98) 100%);
            border: 2px solid #b48a48;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 235, 180, 0.25);
        }

        .medieval-btn {
            background: linear-gradient(180deg, #4a3520 0%, #2a1d11 100%);
            border: 1.5px solid #a37c40;
            color: #fef3c7;
            transition: all 0.12s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .medieval-btn:hover:not(:disabled) {
            border-color: #fbbf24;
            background: linear-gradient(180deg, #5c4228 0%, #382717 100%);
        }

        .medieval-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .medieval-btn.active {
            background: linear-gradient(180deg, #b45309 0%, #78350f 100%);
            border-color: #fde047;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.45);
        }

        .medieval-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        ::-webkit-scrollbar {
            height: 4px;
            width: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #b48a48;
            border-radius: 4px;
        }
    </style>
</head>

<body class="relative w-screen h-screen overflow-hidden select-none">

    <!-- Main 2.5D Battlefield Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Top Resource & Kingdom Bar -->
    <header
        class="fixed top-0 left-0 right-0 z-20 medieval-panel border-t-0 border-x-0 px-2 py-1.5 flex items-center justify-between gap-2">
        <!-- Resources -->
        <div class="flex items-center gap-1.5 sm:gap-3 overflow-x-auto no-scrollbar py-0.5">
            <div class="flex items-center gap-1 bg-black/50 border border-amber-700/50 rounded-lg px-2 py-1 text-xs sm:text-sm font-bold whitespace-nowrap"
                title="Holz">
                <span>🪵</span>
                <span id="uiWood" class="text-amber-200">250</span>
            </div>
            <div class="flex items-center gap-1 bg-black/50 border border-amber-700/50 rounded-lg px-2 py-1 text-xs sm:text-sm font-bold whitespace-nowrap"
                title="Nahrung">
                <span>🥩</span>
                <span id="uiFood" class="text-rose-200">250</span>
            </div>
            <div class="flex items-center gap-1 bg-black/50 border border-amber-700/50 rounded-lg px-2 py-1 text-xs sm:text-sm font-bold whitespace-nowrap"
                title="Gold">
                <span>🪙</span>
                <span id="uiGold" class="text-yellow-300">150</span>
            </div>
            <div class="flex items-center gap-1 bg-black/50 border border-amber-700/50 rounded-lg px-2 py-1 text-xs sm:text-sm font-bold whitespace-nowrap"
                title="Stein">
                <span>🪨</span>
                <span id="uiStone" class="text-stone-300">150</span>
            </div>
            <div class="flex items-center gap-1 bg-black/50 border border-amber-700/50 rounded-lg px-2 py-1 text-xs sm:text-sm font-bold whitespace-nowrap"
                title="Bevölkerung">
                <span>⛺</span>
                <span id="uiPop" class="text-emerald-300">4/15</span>
            </div>
        </div>

        <!-- Age Display & Audio Controls -->
        <div class="flex items-center gap-1.5 shrink-0">
            <button id="btnCiv"
                class="medieval-btn rounded-lg px-2.5 py-1 text-xs sm:text-sm font-medieval font-bold flex items-center gap-1.5 whitespace-nowrap"
                title="Klicke hier, um deine Zivilisation zu wechseln!">
                <span id="uiCivIcon">⚜️</span>
                <span id="uiCivName">Franken</span>
            </button>
            <button id="btnAgeUp"
                class="medieval-btn rounded-lg px-2.5 py-1 text-xs sm:text-sm font-medieval font-bold flex items-center gap-1.5 whitespace-nowrap">
                <span>👑</span>
                <span id="uiAgeName">I. Dunkles Zeitalter</span>
            </button>
            <button id="btnMusic" class="medieval-btn rounded-lg p-1.5 text-xs sm:text-sm"
                title="Mittelalter-Musik an/aus">🎵</button>
            <button id="btnSound" class="medieval-btn active rounded-lg p-1.5 text-xs sm:text-sm"
                title="Soundeffekte an/aus">🔊</button>
            <button id="btnRestart" class="medieval-btn rounded-lg p-1.5 text-xs sm:text-sm"
                title="Neue Schlacht starten">🔄</button>
        </div>
    </header>

    <!-- Toast Banner -->
    <div id="toastBanner"
        class="fixed top-14 left-1/2 -translate-x-1/2 z-30 pointer-events-none transition-all duration-300 opacity-0 -translate-y-2">
        <div id="toastBox"
            class="medieval-panel rounded-full px-4 py-1.5 text-xs sm:text-sm font-semibold text-amber-200 shadow-xl text-center">
            Willkommen, Herrscher!
        </div>
    </div>

    <!-- Left Floating Quick Actions & Mobile Touch Mode Switcher -->
    <div class="fixed left-2 bottom-36 sm:bottom-40 z-20 flex flex-col gap-1.5">
        <div class="flex gap-1">
            <button id="btnIdleVillager"
                class="medieval-btn rounded-lg px-2.5 py-1.5 text-xs font-bold flex items-center gap-1"
                title="Alle untätigen Dorfbewohner auswählen (Taste . oder ,)">
                <span>💤</span><span class="hidden sm:inline">Alle Untätigen (.)</span>
                <span id="idleBadge" class="bg-amber-600 text-white text-[10px] px-1.5 rounded-full">0</span>
            </button>
            <button id="btnSelectArmy"
                class="medieval-btn rounded-lg px-2.5 py-1.5 text-xs font-bold flex items-center gap-1"
                title="Gesamte Armee auswählen (Taste F)">
                <span>⚔️</span><span class="hidden sm:inline">Armee</span>
            </button>
            <button id="btnFormation"
                class="medieval-btn rounded-lg px-2.5 py-1.5 text-xs font-bold flex items-center gap-1 text-sky-200"
                title="Formations-Modus wechseln: Kasten / Linie / Gestaffelt (Taste Z)">
                <span id="formationIcon">⛶</span><span class="hidden sm:inline" id="formationName">Kasten</span>
            </button>
            <button id="btnHomeTC"
                class="medieval-btn rounded-lg px-2.5 py-1.5 text-xs font-bold flex items-center gap-1"
                title="Zum Dorfzentrum springen (Leertaste / H)">
                <span>🏛️</span><span class="hidden sm:inline">Basis</span>
            </button>
            <button id="btnTownBell"
                class="medieval-btn rounded-lg px-2.5 py-1.5 text-xs font-bold flex items-center gap-1 text-amber-200"
                title="Alarmglocke läuten: Alle Dorfbewohner suchen Schutz im Dorfzentrum/Turm! (Taste B)">
                <span>🔔</span><span class="hidden sm:inline">Glocke</span>
            </button>
        </div>
        <!-- Touch Mode Switcher -->
        <div class="flex gap-1 bg-black/60 p-1 rounded-xl border border-amber-700/50">
            <button id="modeCmd"
                class="medieval-btn active rounded-lg px-2.5 py-1.5 text-xs font-bold flex items-center gap-1">
                <span>👆</span><span>Befehl</span>
            </button>
            <button id="modeBox"
                class="medieval-btn rounded-lg px-2.5 py-1.5 text-xs font-bold flex items-center gap-1">
                <span>🔲</span><span>Rahmen</span>
            </button>
            <button id="modeCam"
                class="medieval-btn rounded-lg px-2.5 py-1.5 text-xs font-bold flex items-center gap-1">
                <span>✋</span><span>Kamera</span>
            </button>
        </div>
    </div>

    <!-- Right Interactive Minimap -->
    <div class="fixed right-2 bottom-36 sm:bottom-40 z-20 medieval-panel rounded-xl p-1 shadow-2xl">
        <canvas id="minimapCanvas" width="136" height="136"
            class="rounded-lg block cursor-pointer touch-none w-[112px] h-[112px] sm:w-[136px] sm:h-[136px]"></canvas>
    </div>

    <!-- Bottom Selection & Command Deck -->
    <footer
        class="fixed bottom-0 left-0 right-0 h-32 sm:h-36 z-20 medieval-panel border-b-0 border-x-0 px-2.5 py-2 flex items-center gap-2.5">
        <!-- Selected Entity Card -->
        <div
            class="w-36 sm:w-52 h-full bg-black/45 border border-amber-700/40 rounded-xl p-2 flex flex-col justify-between shrink-0">
            <div class="flex items-start gap-2">
                <div id="selIcon"
                    class="w-9 h-9 sm:w-11 sm:h-11 rounded-lg bg-amber-950/80 border border-amber-600/50 flex items-center justify-center text-xl sm:text-2xl shrink-0">
                    🛡️
                </div>
                <div class="min-w-0 flex-1">
                    <div id="selTitle" class="font-medieval font-bold text-xs sm:text-sm text-amber-300 truncate">Keine
                        Auswahl</div>
                    <div id="selSub" class="text-[11px] text-amber-100/75 leading-tight truncate">Tippe auf
                        Einheit/Gebäude</div>
                </div>
            </div>
            <div id="selStatsRow" class="text-[11px] text-amber-200/90 flex items-center justify-between gap-1">
                <span id="selHpText">Bereit</span>
                <span id="selExtraText" class="text-sky-300 font-semibold"></span>
            </div>
            <div class="w-full h-2 bg-stone-900 rounded-full overflow-hidden border border-amber-800/60">
                <div id="selHpBar" class="h-full bg-emerald-500 transition-all duration-150" style="width: 0%"></div>
            </div>
        </div>

        <!-- Action / Build / Train Buttons Grid -->
        <div id="actionPanel" class="flex-1 h-full flex items-center gap-2 overflow-x-auto py-0.5"></div>
    </footer>

    <!-- Victory / Defeat Modal -->
    <div id="gameOverModal"
        class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="medieval-panel rounded-2xl max-w-md w-full p-6 text-center space-y-4">
            <div id="modalIcon" class="text-5xl">🏆</div>
            <h2 id="modalTitle" class="font-medieval text-2xl sm:text-3xl font-bold text-amber-300">Glorreicher Sieg!
            </h2>
            <p id="modalDesc" class="text-sm text-amber-100/85">Du hast das feindliche Imperium bezwungen und deine
                Vorherrschaft gesichert.</p>
            <button id="btnModalRestart"
                class="medieval-btn active rounded-xl px-6 py-3 font-medieval font-bold text-base w-full">
                ⚔️ Neues Imperium gründen
            </button>
        </div>
    </div>

    <script>
        // Safety guard to prevent IndexSizeError if any dynamic radius ever drops below 0
        (() => {
            const origEllipse = CanvasRenderingContext2D.prototype.ellipse;
            CanvasRenderingContext2D.prototype.ellipse = function (x, y, radiusX, radiusY, rotation, startAngle, endAngle, counterclockwise) {
                return origEllipse.call(
                    this,
                    x,
                    y,
                    Math.max(0.001, radiusX || 0),
                    Math.max(0.001, radiusY || 0),
                    rotation,
                    startAngle,
                    endAngle,
                    counterclockwise
                );
            };
            const origArc = CanvasRenderingContext2D.prototype.arc;
            CanvasRenderingContext2D.prototype.arc = function (x, y, radius, startAngle, endAngle, counterclockwise) {
                return origArc.call(
                    this,
                    x,
                    y,
                    Math.max(0.001, radius || 0),
                    startAngle,
                    endAngle,
                    counterclockwise
                );
            };
        })();

        class SoundSystem {
            constructor() {
                this.enabled = true;
                this.musicEnabled = false;
                this.ctx = null;
                this.noiseBuffer = null;
                this.reverbNode = null;
                this.musicTimer = null;
                this.musicStep = 0;
                this.combatIntensity = 0;
                this.voiceCooldown = 0;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        this.ctx = new AudioCtx();
                        this.createNoiseBuffer();
                        this.createReverb();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume().catch(() => { });
                }
            }

            createNoiseBuffer() {
                if (!this.ctx) return;
                const sr = this.ctx.sampleRate;
                const buffer = this.ctx.createBuffer(1, sr * 1.0, sr);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                this.noiseBuffer = buffer;
            }

            createReverb() {
                if (!this.ctx) return;
                try {
                    const sr = this.ctx.sampleRate;
                    const length = Math.floor(sr * 1.4);
                    const impulse = this.ctx.createBuffer(2, length, sr);
                    for (let ch = 0; ch < 2; ch++) {
                        const chData = impulse.getChannelData(ch);
                        for (let i = 0; i < length; i++) {
                            chData[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.6);
                        }
                    }
                    this.reverbNode = this.ctx.createConvolver();
                    this.reverbNode.buffer = impulse;
                    const wetGain = this.ctx.createGain();
                    wetGain.gain.value = 0.28;
                    this.reverbNode.connect(wetGain);
                    wetGain.connect(this.ctx.destination);
                } catch (e) { }
            }

            connectOut(node, useReverb = true, pan = 0, volMult = 1) {
                if (!this.ctx) return;
                let target = node;
                if (volMult !== 1) {
                    const g = this.ctx.createGain();
                    g.gain.value = volMult;
                    node.connect(g);
                    target = g;
                }
                if (pan !== 0 && this.ctx.createStereoPanner) {
                    try {
                        const panner = this.ctx.createStereoPanner();
                        panner.pan.value = Math.max(-1, Math.min(1, pan));
                        target.connect(panner);
                        target = panner;
                    } catch (e) { }
                }
                target.connect(this.ctx.destination);
                if (useReverb && this.reverbNode) {
                    target.connect(this.reverbNode);
                }
            }

            speak(text, { pitch = 1.0, rate = 1.0, volume = 0.85 } = {}) {
                if (!this.enabled || !window.speechSynthesis) return;
                const now = performance.now();
                if (now - this.voiceCooldown < 700) return; // Prevent utterance stutter
                this.voiceCooldown = now;
                try {
                    window.speechSynthesis.cancel();
                    const utter = new SpeechSynthesisUtterance(text);
                    utter.lang = 'de-DE';
                    utter.pitch = pitch;
                    utter.rate = rate;
                    utter.volume = volume;
                    window.speechSynthesis.speak(utter);
                } catch (e) { }
            }

            playNoiseBurst(duration, filterFreq, filterType, gainVal, Q = 1.0, pan = 0) {
                if (!this.ctx || !this.noiseBuffer) return;
                const now = this.ctx.currentTime;
                const src = this.ctx.createBufferSource();
                src.buffer = this.noiseBuffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = filterType;
                filter.frequency.setValueAtTime(filterFreq, now);
                filter.Q.setValueAtTime(Q, now);
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(gainVal, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                src.connect(filter);
                filter.connect(gain);
                this.connectOut(gain, true, pan);
                src.start(now);
                src.stop(now + duration);
            }

            play(type, pan = 0, volMult = 1) {
                if (!this.enabled) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;

                    if (type === 'click') {
                        const osc = this.ctx.createOscillator();
                        const g = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(640, now);
                        osc.frequency.exponentialRampToValueAtTime(240, now + 0.05);
                        g.gain.setValueAtTime(0.11 * volMult, now);
                        g.gain.exponentialRampToValueAtTime(0.003, now + 0.05);
                        osc.connect(g); this.connectOut(g, false, pan);
                        osc.start(now); osc.stop(now + 0.05);
                    } else if (type === 'bell') {
                        [523.25, 1046.5, 1567.98].forEach((freq, i) => {
                            const osc = this.ctx.createOscillator();
                            const g = this.ctx.createGain();
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(freq, now);
                            g.gain.setValueAtTime((0.1 / (i + 1)) * volMult, now);
                            g.gain.exponentialRampToValueAtTime(0.001, now + 0.75);
                            osc.connect(g); this.connectOut(g, true, pan);
                            osc.start(now); osc.stop(now + 0.75);
                        });
                    } else if (type === 'cathedral_bell') {
                        [130.81, 261.63, 392.00, 523.25, 783.99].forEach((freq, i) => {
                            const osc = this.ctx.createOscillator();
                            const g = this.ctx.createGain();
                            osc.type = i % 2 === 0 ? 'sine' : 'triangle';
                            osc.frequency.setValueAtTime(freq, now);
                            osc.frequency.linearRampToValueAtTime(freq * 0.992, now + 2.8);
                            g.gain.setValueAtTime((0.24 / (i * 0.6 + 1)) * volMult, now);
                            g.gain.exponentialRampToValueAtTime(0.001, now + 2.8);
                            osc.connect(g); this.connectOut(g, true, pan);
                            osc.start(now); osc.stop(now + 2.8);
                        });
                        this.playNoiseBurst(0.18, 420, 'lowpass', 0.22, 1.2, pan);
                    } else if (type === 'wololo') {
                        const tones = [
                            { f: 440, dur: 0.28, del: 0 },
                            { f: 587.33, dur: 0.35, del: 0.25 },
                            { f: 392.00, dur: 0.30, del: 0.58 },
                            { f: 523.25, dur: 0.55, del: 0.85 }
                        ];
                        tones.forEach(t => {
                            const st = now + t.del;
                            const osc = this.ctx.createOscillator();
                            const g = this.ctx.createGain();
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(t.f, st);
                            osc.frequency.linearRampToValueAtTime(t.f * 1.04, st + t.dur * 0.5);
                            osc.frequency.linearRampToValueAtTime(t.f, st + t.dur);
                            g.gain.setValueAtTime(0.14 * volMult, st);
                            g.gain.exponentialRampToValueAtTime(0.002, st + t.dur);
                            osc.connect(g); this.connectOut(g, true, pan);
                            osc.start(st); osc.stop(st + t.dur);
                        });
                    } else if (type === 'heal') {
                        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                            const st = now + idx * 0.08;
                            const osc = this.ctx.createOscillator();
                            const g = this.ctx.createGain();
                            osc.type = 'triangle';
                            osc.frequency.setValueAtTime(freq, st);
                            g.gain.setValueAtTime(0.09 * volMult, st);
                            g.gain.exponentialRampToValueAtTime(0.002, st + 0.45);
                            osc.connect(g); this.connectOut(g, true, pan);
                            osc.start(st); osc.stop(st + 0.45);
                        });
                    } else if (type === 'spear') {
                        this.playNoiseBurst(0.07, 2800, 'bandpass', 0.16, 3.2, pan);
                        const osc = this.ctx.createOscillator();
                        const g = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(320, now);
                        osc.frequency.exponentialRampToValueAtTime(90, now + 0.09);
                        g.gain.setValueAtTime(0.14 * volMult, now);
                        g.gain.exponentialRampToValueAtTime(0.002, now + 0.09);
                        osc.connect(g); this.connectOut(g, false, pan);
                        osc.start(now); osc.stop(now + 0.09);
                    } else if (type === 'javelin') {
                        this.playNoiseBurst(0.12, 1750, 'bandpass', 0.15, 2.0, pan);
                        const osc = this.ctx.createOscillator();
                        const g = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(480, now);
                        osc.frequency.exponentialRampToValueAtTime(160, now + 0.12);
                        g.gain.setValueAtTime(0.1 * volMult, now);
                        g.gain.exponentialRampToValueAtTime(0.003, now + 0.12);
                        osc.connect(g); this.connectOut(g, false, pan);
                        osc.start(now); osc.stop(now + 0.12);
                    } else if (type === 'horse') {
                        [0, 0.09, 0.22].forEach(delay => {
                            setTimeout(() => {
                                if (this.enabled) this.playNoiseBurst(0.06, 520 + Math.random() * 200, 'bandpass', 0.14 * volMult, 3.0, pan);
                            }, delay * 1000);
                        });
                    } else if (type === 'order') {
                        this.playNoiseBurst(0.08, 180, 'lowpass', 0.18 * volMult, 1, pan);
                        const osc = this.ctx.createOscillator();
                        const g = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(260, now);
                        osc.frequency.exponentialRampToValueAtTime(390, now + 0.13);
                        g.gain.setValueAtTime(0.13 * volMult, now);
                        g.gain.exponentialRampToValueAtTime(0.004, now + 0.14);
                        osc.connect(g); this.connectOut(g, true, pan);
                        osc.start(now); osc.stop(now + 0.14);
                    } else if (type === 'attack_order') {
                        [220, 330].forEach((f, idx) => {
                            const osc = this.ctx.createOscillator();
                            const g = this.ctx.createGain();
                            osc.type = 'sawtooth';
                            const st = now + idx * 0.06;
                            osc.frequency.setValueAtTime(f, st);
                            g.gain.setValueAtTime(0.11 * volMult, st);
                            g.gain.exponentialRampToValueAtTime(0.003, st + 0.24);
                            osc.connect(g); this.connectOut(g, true, pan);
                            osc.start(st); osc.stop(st + 0.24);
                        });
                        this.playNoiseBurst(0.12, 220, 'lowpass', 0.2 * volMult, 1, pan);
                    } else if (type === 'woodchop') {
                        const osc = this.ctx.createOscillator();
                        const g = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(190, now);
                        osc.frequency.exponentialRampToValueAtTime(58, now + 0.08);
                        g.gain.setValueAtTime(0.18 * volMult, now);
                        g.gain.exponentialRampToValueAtTime(0.004, now + 0.08);
                        osc.connect(g); this.connectOut(g, false, pan);

            toggleMusic() {
                this.init();
                this.musicEnabled = !this.musicEnabled;
                if (this.musicEnabled) {
                    const lutePeace = [293.66, 349.23, 440.00, 392.00, 329.63, 392.00, 440.00, 523.25, 587.33, 440.00, 392.00, 349.23, 329.63, 293.66, 261.63, 293.66];
                    const bassPeace = [146.83, 146.83, 146.83, 130.81, 164.81, 164.81, 174.61, 130.81, 146.83, 146.83, 130.81, 174.61, 164.81, 146.83, 130.81, 146.83];
                    const warNotes = [146.83, 174.61, 196.00, 220.00, 146.83, 164.81, 174.61, 130.81];

                    this.musicTimer = setInterval(() => {
                        if (!this.musicEnabled || !this.ctx) return;
                        const now = this.ctx.currentTime;
                        const isWar = this.combatIntensity > 0.35;
                        const notes = isWar ? warNotes : lutePeace;
                        const bass = bassPeace;
                        const step = this.musicStep % notes.length;
                        this.musicStep++;

                        const osc = this.ctx.createOscillator();
                        const g = this.ctx.createGain();
                        osc.type = isWar ? 'sawtooth' : 'triangle';
                        osc.frequency.setValueAtTime(notes[step], now);
                        g.gain.setValueAtTime(isWar ? 0.08 : 0.065, now);
                        g.gain.exponentialRampToValueAtTime(0.002, now + (isWar ? 0.22 : 0.38));
                        osc.connect(g);
                        this.connectOut(g, true);
                        osc.start(now); osc.stop(now + (isWar ? 0.22 : 0.38));

                        if (step % 2 === 0) {
                            const bOsc = this.ctx.createOscillator();
                            const bGain = this.ctx.createGain();
                            bOsc.type = 'sine';
                            bOsc.frequency.setValueAtTime(bass[step % bass.length], now);
                            bGain.gain.setValueAtTime(isWar ? 0.075 : 0.055, now);
                            bGain.gain.exponentialRampToValueAtTime(0.002, now + 0.65);
                            bOsc.connect(bGain);
                            this.connectOut(bGain, true);
                            bOsc.start(now); bOsc.stop(now + 0.65);
                        }

                        if (isWar || step % 4 === 0 || step % 4 === 3) {
                            this.playNoiseBurst(isWar ? 0.09 : 0.07, isWar ? 120 : (step % 4 === 0 ? 160 : 320), 'lowpass', isWar ? 0.08 : 0.055);
                        }
                    }, 340);
                } else if (this.musicTimer) {
                    clearInterval(this.musicTimer);
                    this.musicTimer = null;
                }
                return this.musicEnabled;
            }
        }

        class NavGrid {
            constructor(worldSize, cellSize = 40) {
                this.worldSize = worldSize;
                this.cellSize = cellSize;
                this.cols = Math.ceil(worldSize / cellSize);
                this.rows = Math.ceil(worldSize / cellSize);
                this.staticGrid = new Uint8Array(this.cols * this.rows);
                this.dynamicGrid = new Uint8Array(this.cols * this.rows);
            }

            setStaticLakes(lakes) {
                this.staticGrid.fill(0);
                for (const lk of lakes) {
                    const minX = Math.max(0, Math.floor((lk.x - lk.rx - 14) / this.cellSize));
                    const maxX = Math.min(this.cols - 1, Math.ceil((lk.x + lk.rx + 14) / this.cellSize));
                    const minY = Math.max(0, Math.floor((lk.y - lk.ry - 14) / this.cellSize));
                    const maxY = Math.min(this.rows - 1, Math.ceil((lk.y + lk.ry + 14) / this.cellSize));
                    for (let y = minY; y <= maxY; y++) {
                        for (let x = minX; x <= maxX; x++) {
                            const wx = (x + 0.5) * this.cellSize;
                            const wy = (y + 0.5) * this.cellSize;
                            const dx = wx - lk.x;
                            const dy = wy - lk.y;
                            const cos = Math.cos(0.2);
                            const sin = Math.sin(0.2);
                            const rx = dx * cos + dy * sin;
                            const ry = -dx * sin + dy * cos;
                            if ((rx * rx) / ((lk.rx + 10) * (lk.rx + 10)) + (ry * ry) / ((lk.ry + 8) * (lk.ry + 8)) <= 1.0) {
                                this.staticGrid[y * this.cols + x] = 1;
                            }
                        }
                    }
                }
                this.rebuildDynamic([]);
            }

            rebuildDynamic(buildings) {
                this.dynamicGrid.set(this.staticGrid);
                for (const b of buildings) {
                    if (b.hp <= 0 || b.isFarm) continue;
                    const rad = Math.max(14, b.radius * 0.72);
                    const minX = Math.max(0, Math.floor((b.x - rad) / this.cellSize));
                    const maxX = Math.min(this.cols - 1, Math.ceil((b.x + rad) / this.cellSize));
                    const minY = Math.max(0, Math.floor((b.y - rad) / this.cellSize));
                    const maxY = Math.min(this.rows - 1, Math.ceil((b.y + rad) / this.cellSize));
                    for (let y = minY; y <= maxY; y++) {
                        for (let x = minX; x <= maxX; x++) {
                            this.dynamicGrid[y * this.cols + x] = 1;
                        }
                    }
                }
            }

            rebuildFromBuildings(buildings) {
                return this.rebuildDynamic(buildings);
            }

            isBlocked(gx, gy) {
                if (gx < 0 || gx >= this.cols || gy < 0 || gy >= this.rows) return true;
                return this.dynamicGrid[gy * this.cols + gx] === 1;
            }

            isWorldBlocked(wx, wy, radius = 0) {
                const gx = Math.floor(wx / this.cellSize);
                const gy = Math.floor(wy / this.cellSize);
                if (this.isBlocked(gx, gy)) return true;
                if (radius > 0) {
                    const radCells = Math.ceil(radius / this.cellSize);
                    for (let dy = -radCells; dy <= radCells; dy++) {
                        for (let dx = -radCells; dx <= radCells; dx++) {
                            if (this.isBlocked(gx + dx, gy + dy)) {
                                const cellWx = (gx + dx + 0.5) * this.cellSize;
                                const cellWy = (gy + dy + 0.5) * this.cellSize;
                                if (Math.hypot(cellWx - wx, cellWy - wy) < radius + this.cellSize * 0.35) {
                                    return true;
                                }
                            }
                        }
                    }
                }
                return false;
            }

            hasLineOfSight(x0, y0, x1, y1) {
                const dx = x1 - x0;
                const dy = y1 - y0;
                const dist = Math.hypot(dx, dy);
                const steps = Math.max(1, Math.ceil(dist / (this.cellSize * 0.5)));
                for (let i = 1; i < steps; i++) {
                    const t = i / steps;
                    const px = x0 + dx * t;
                    const py = y0 + dy * t;
                    if (this.isWorldBlocked(px, py, 4)) return false;
                }
                return true;
            }

            findPath(startX, startY, targetX, targetY) {
                if (this.hasLineOfSight(startX, startY, targetX, targetY)) {
                    return [{ x: targetX, y: targetY }];
                }

                const startGx = Math.max(0, Math.min(this.cols - 1, Math.floor(startX / this.cellSize)));
                const startGy = Math.max(0, Math.min(this.rows - 1, Math.floor(startY / this.cellSize)));
                let endGx = Math.max(0, Math.min(this.cols - 1, Math.floor(targetX / this.cellSize)));
                let endGy = Math.max(0, Math.min(this.rows - 1, Math.floor(targetY / this.cellSize)));

                if (this.isBlocked(endGx, endGy)) {
                    let found = false;
                    let bestDist = Infinity;
                    for (let r = 1; r <= 3 && !found; r++) {
                        for (let dy = -r; dy <= r; dy++) {
                            for (let dx = -r; dx <= r; dx++) {
                                const nx = endGx + dx, ny = endGy + dy;
                                if (!this.isBlocked(nx, ny)) {
                                    const d = Math.hypot(nx - endGx, ny - endGy);
                                    if (d < bestDist) {
                                        bestDist = d;
                                        endGx = nx; endGy = ny;
                                        found = true;
                                    }
                                }
                            }
                        }
                    }
                }

                const openSet = [];
                const cameFrom = new Int32Array(this.cols * this.rows).fill(-1);
                const gScore = new Float32Array(this.cols * this.rows).fill(1e9);
                const fScore = new Float32Array(this.cols * this.rows).fill(1e9);

                const startIdx = startGy * this.cols + startGx;
                const endIdx = endGy * this.cols + endGx;

                gScore[startIdx] = 0;
                fScore[startIdx] = Math.hypot(endGx - startGx, endGy - startGy);
                openSet.push(startIdx);

                let iterations = 0;
                const maxIter = 350;

                while (openSet.length > 0 && iterations++ < maxIter) {
                    let lowestIdx = 0;
                    for (let i = 1; i < openSet.length; i++) {
                        if (fScore[openSet[i]] < fScore[openSet[lowestIdx]]) lowestIdx = i;
                    }
                    const current = openSet.splice(lowestIdx, 1)[0];

                    if (current === endIdx) {
                        const rawPath = [];
                        let curr = current;
                        while (curr !== -1) {
                            const cx = curr % this.cols;
                            const cy = Math.floor(curr / this.cols);
                            rawPath.unshift({ x: (cx + 0.5) * this.cellSize, y: (cy + 0.5) * this.cellSize });
                            curr = cameFrom[curr];
                        }
                        rawPath[0] = { x: startX, y: startY };
                        rawPath[rawPath.length - 1] = { x: targetX, y: targetY };

                        const smoothed = [rawPath[0]];
                        let curP = 0;
                        while (curP < rawPath.length - 1) {
                            let nextP = rawPath.length - 1;
                            while (nextP > curP + 1) {
                                if (this.hasLineOfSight(rawPath[curP].x, rawPath[curP].y, rawPath[nextP].x, rawPath[nextP].y)) {
                                    break;
                                }
                                nextP--;
                            }
                            smoothed.push(rawPath[nextP]);
                            curP = nextP;
                        }
                        return smoothed.slice(1);
                    }

                    const cx = current % this.cols;
                    const cy = Math.floor(current / this.cols);

                    const neighbors = [
                        { x: cx + 1, y: cy, c: 1 }, { x: cx - 1, y: cy, c: 1 },
                        { x: cx, y: cy + 1, c: 1 }, { x: cx, y: cy - 1, c: 1 },
                        { x: cx + 1, y: cy + 1, c: 1.414 }, { x: cx - 1, y: cy + 1, c: 1.414 },
                        { x: cx + 1, y: cy - 1, c: 1.414 }, { x: cx - 1, y: cy - 1, c: 1.414 }
                    ];

                    for (const nb of neighbors) {
                        if (nb.x < 0 || nb.x >= this.cols || nb.y < 0 || nb.y >= this.rows) continue;
                        if (this.isBlocked(nb.x, nb.y)) continue;
                        if (nb.c > 1 && (this.isBlocked(cx, nb.y) || this.isBlocked(nb.x, cy))) continue;

                        const nbIdx = nb.y * this.cols + nb.x;
                        const tentativeG = gScore[current] + nb.c;

                        if (tentativeG < gScore[nbIdx]) {
                            cameFrom[nbIdx] = current;
                            gScore[nbIdx] = tentativeG;
                            fScore[nbIdx] = tentativeG + Math.hypot(endGx - nb.x, endGy - nb.y);
                            if (!openSet.includes(nbIdx)) openSet.push(nbIdx);
                        }
                    }
                }
                return [{ x: targetX, y: targetY }];
            }
        }

        class GameEngine {

            resize() {
                this.canvas.width = window.innerWidth || 800;
                this.canvas.height = window.innerHeight || 600;
            }

            // 2:1 Isometric 3D Projection: maps (wx, wy, wz) -> (ix, iy)
            worldToIso(wx, wy, wz = 0) {
                return {
                    x: wx - wy,
                    y: (wx + wy) * 0.5 - wz
                };
            }

            // Inverse 2:1 Isometric Projection: maps (ix, iy) on ground plane (wz=0) -> (wx, wy)
            isoToWorld(ix, iy) {
                return {
                    x: iy + ix * 0.5,
                    y: iy - ix * 0.5
                };
            }

            worldToScreen(wx, wy, wz = 0) {
                const iso = this.worldToIso(wx, wy, wz);
                return {
                    x: (iso.x - this.camera.x) * this.camera.zoom + this.canvas.width * 0.5,
                    y: (iso.y - this.camera.y) * this.camera.zoom + this.canvas.height * 0.5
                };
            }

            screenToWorld(sx, sy) {
                const ix = (sx - this.canvas.width * 0.5) / this.camera.zoom + this.camera.x;
                const iy = (sy - this.canvas.height * 0.5) / this.camera.zoom + this.camera.y;
                const w = this.isoToWorld(ix, iy);
                return {
                    x: Math.max(0, Math.min(this.worldSize, w.x)),
                    y: Math.max(0, Math.min(this.worldSize, w.y))
                };
            }

            generateTerrainTexture() {
                const off = document.createElement('canvas');
                off.width = this.worldSize;
                off.height = this.worldSize;
                const tctx = off.getContext('2d');

                // Lush medieval valley base gradient
                const grad = tctx.createLinearGradient(0, 0, this.worldSize, this.worldSize);
                grad.addColorStop(0, '#365826');
                grad.addColorStop(0.5, '#3f662c');
                grad.addColorStop(1, '#2f4e21');
                tctx.fillStyle = grad;
                tctx.fillRect(0, 0, this.worldSize, this.worldSize);

                // Soft organic biome patches
                for (let i = 0; i < 180; i++) {
                    const px = Math.random() * this.worldSize;
                    const py = Math.random() * this.worldSize;
                    const pr = 50 + Math.random() * 140;
                    const g = tctx.createRadialGradient(px, py, 5, px, py, pr);
                    g.addColorStop(0, i % 2 === 0 ? 'rgba(74, 118, 48, 0.26)' : 'rgba(42, 68, 28, 0.24)');
                    g.addColorStop(1, 'rgba(0,0,0,0)');
                    tctx.fillStyle = g;
                    tctx.beginPath();
                    tctx.arc(px, py, pr, 0, Math.PI * 2);
                    tctx.fill();
                }

                // Paved Royal Trade Road connecting South-West Player Valley to North-East Enemy Fortress
                tctx.save();
                tctx.strokeStyle = 'rgba(138, 118, 90, 0.48)';
                tctx.lineWidth = 46;
                tctx.lineCap = 'round';
                tctx.beginPath();
                tctx.moveTo(420, 1940);
                tctx.bezierCurveTo(950, 1620, 1380, 920, 1940, 460);
                tctx.stroke();

                tctx.strokeStyle = 'rgba(180, 160, 130, 0.35)';
                tctx.lineWidth = 28;
                tctx.setLineDash([12, 10]);
                tctx.stroke();
                tctx.restore();

                // Two Scenic Oasis Lakes
                this.lakes = [
                    { x: 760, y: 1220, rx: 125, ry: 85 },
                    { x: 1580, y: 1420, rx: 135, ry: 92 }
                ];
                this.lakes.forEach(lk => {
                    // Sandy shore
                    tctx.fillStyle = '#c2a675';
                    tctx.beginPath();
                    tctx.ellipse(lk.x, lk.y, lk.rx + 18, lk.ry + 16, -0.2, 0, Math.PI * 2);
                    tctx.fill();

                    // Shallow & deep water
                    const wg = tctx.createRadialGradient(lk.x - 15, lk.y - 15, 10, lk.x, lk.y, lk.rx);
                    wg.addColorStop(0, '#0284c7');
                    wg.addColorStop(0.7, '#0369a1');
                    wg.addColorStop(1, '#075985');
                    tctx.fillStyle = wg;
                    tctx.beginPath();
                    tctx.ellipse(lk.x, lk.y, lk.rx, lk.ry, -0.2, 0, Math.PI * 2);
                    tctx.fill();
                });

                // Fine grass blades & wildflowers
                for (let i = 0; i < 3200; i++) {
                    const gx = Math.random() * this.worldSize;
                    const gy = Math.random() * this.worldSize;
                    tctx.fillStyle = i % 9 === 0 ? '#fde047' : (i % 2 === 0 ? '#4d7c36' : '#29461b');
                    tctx.fillRect(gx, gy, 2.5, 2.5);
                }

                this.terrainCanvas = off;
            }

            // Draws a 3D Architectural Glass Panel with Specular Sky Reflection, Interior Warmth, and Mullion Frames
            draw3DGlassPanel(ctx, v0, v1, v2, v3, frameCol = '#1e293b') {
                const p0 = this.worldToIso(v0.x, v0.y, v0.z);
                const p1 = this.worldToIso(v1.x, v1.y, v1.z);
                const p2 = this.worldToIso(v2.x, v2.y, v2.z);
                const p3 = this.worldToIso(v3.x, v3.y, v3.z);

                // Warm interior glow + cool sky reflection gradient
                const grad = ctx.createLinearGradient(p0.x, p2.y, p1.x, p0.y);
                grad.addColorStop(0, 'rgba(56, 189, 248, 0.78)');
                grad.addColorStop(0.45, 'rgba(254, 240, 138, 0.85)');
                grad.addColorStop(1, 'rgba(245, 158, 11, 0.92)');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.moveTo(p0.x, p0.y);
                ctx.lineTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.lineTo(p3.x, p3.y);
                ctx.closePath();
                ctx.fill();

                // Diagonal specular glass sheen
                ctx.fillStyle = 'rgba(255, 255, 255, 0.38)';
                ctx.beginPath();
                ctx.moveTo(p0.x, p0.y);
                ctx.lineTo((p0.x + p1.x) * 0.5, (p0.y + p1.y) * 0.5);
                ctx.lineTo(p2.x, p2.y);
                ctx.lineTo((p3.x + p2.x) * 0.5, (p3.y + p2.y) * 0.5);
                ctx.closePath();
                ctx.fill();

                // Architectural Mullion Frame
                ctx.strokeStyle = frameCol;
                ctx.lineWidth = 1.1;
                ctx.beginPath();
                ctx.moveTo(p0.x, p0.y);
                ctx.lineTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.lineTo(p3.x, p3.y);
                ctx.closePath();
                ctx.stroke();

                // Vertical center mullion
                ctx.beginPath();
                ctx.moveTo((p0.x + p1.x) * 0.5, (p0.y + p1.y) * 0.5);
                ctx.lineTo((p3.x + p2.x) * 0.5, (p3.y + p2.y) * 0.5);
                ctx.stroke();
            }

            // Draws warm architectural interior light spilling onto a terrace or ground plane
            drawIsoLightSpill(ctx, wx, wy, wz, rx, ry, alpha = 0.38) {
                const c = this.worldToIso(wx, wy, wz);
                const rScreen = Math.max(4, rx * 1.25);
                const g = ctx.createRadialGradient(c.x, c.y, 1, c.x, c.y, rScreen);
                g.addColorStop(0, `rgba(254, 240, 138, ${alpha})`);
                g.addColorStop(0.55, `rgba(251, 191, 36, ${alpha * 0.45})`);
                g.addColorStop(1, 'rgba(251, 191, 36, 0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.ellipse(c.x, c.y, rx * 1.3, ry * 0.65, 0, 0, Math.PI * 2);
                ctx.fill();
            }

                // Shimmering animated water surface polygon

            }

            generateWorld() {
                const spawnCluster = (type, cx, cy, count, spread, amount) => {
                    for (let i = 0; i < count; i++) {
                        const a = Math.random() * Math.PI * 2;
                        const d = Math.random() * spread;
                        const x = Math.max(70, Math.min(this.worldSize - 70, cx + Math.cos(a) * d));
                        const y = Math.max(70, Math.min(this.worldSize - 70, cy + Math.sin(a) * d));
                        this.resources.push({
                            id: this.idCounter++,
                            entityKind: 'resource',
                            type,
                            x, y,
                            radius: type === 'wood' ? 19 : 17,
                            amount,
                            maxAmount: amount,
                            hitShake: 0
                        });
                    }
                };

                // Player Home Valley (Bottom-Left: ~420, 1920)
                spawnCluster('wood', 250, 1740, 16, 110, 250);
                spawnCluster('wood', 640, 2120, 15, 105, 250);
                spawnCluster('food', 540, 1820, 6, 48, 300);
                spawnCluster('gold', 310, 2140, 5, 42, 420);
                spawnCluster('stone', 690, 1930, 5, 40, 380);

                // Middle & Expansion Resource Clusters
                const midSpots = [
                    [920, 1500, 'wood', 18], [1350, 1220, 'gold', 6], [1050, 960, 'stone', 6],
                    [1500, 1650, 'wood', 16], [850, 620, 'gold', 6], [1420, 820, 'food', 6],
                    [1180, 1340, 'wood', 14], [1680, 1120, 'stone', 5]
                ];
                midSpots.forEach(([cx, cy, t, cnt]) => {
                    spawnCluster(t, cx, cy, cnt, t === 'wood' ? 115 : 46, 360);
                });

                // Player Base
                const pTC = this.spawnBuilding('towncenter', 420, 1940, 'player', true);
                this.spawnBuilding('house', 300, 1900, 'player', true);
                const v1 = this.spawnUnit('villager', 385, 2015, 'player');
                const v2 = this.spawnUnit('villager', 425, 2025, 'player');
                const v3 = this.spawnUnit('villager', 465, 2015, 'player');
                this.spawnUnit('militia', 505, 1965, 'player');
                this.selectedIds.add(v1.id);
                this.selectedIds.add(v2.id);
                this.selectedIds.add(v3.id);

                // Enemy Base (Top-Right: ~1940, 460)
                this.spawnBuilding('towncenter', 1940, 460, 'enemy', true);
                this.spawnBuilding('castle', 1780, 580, 'enemy', true);
                this.spawnBuilding('barracks', 1820, 380, 'enemy', true);
                this.spawnBuilding('archery', 2060, 580, 'enemy', true);
                this.spawnBuilding('tower', 1710, 460, 'enemy', true);
                this.spawnBuilding('tower', 1890, 680, 'enemy', true);

                this.spawnUnit('militia', 1800, 510, 'enemy');
                this.spawnUnit('militia', 1840, 530, 'enemy');
                this.spawnUnit('archer', 1860, 490, 'enemy');
                this.spawnUnit('knight', 1750, 540, 'enemy');

                this.recalculatePop();
            }

            spawnBuilding(type, x, y, faction, completed = false) {
                const def = BUILDINGS_DEF[type];
                const b = {
                    id: this.idCounter++,
                    entityKind: 'building',
                    type,
                    faction,
                    x, y,
                    radius: def.radius,
                    hp: completed ? def.hp : Math.round(def.hp * 0.15),
                    maxHp: def.hp,
                    completed,
                    progress: completed ? 100 : 15,
                    isFarm: !!def.isFarm,
                    farmFood: def.isFarm ? 500 : 0,
                    queue: [],
                    garrison: [],
                    rallyX: x + (faction === 'player' ? 65 : -65),
                    rallyY: y + 55,
                    attackTimer: 0,
                    hurtFlash: 0
                };
                this.buildings.push(b);
                this.recalculatePop();
                return b;
            }

            spawnUnit(type, x, y, faction) {
                const def = UNITS_DEF[type];
                const fState = this.factions[faction];
                const bonusMult = 1 + (fState.age - 1) * 0.12 + (fState.blacksmithLevel || 0) * 0.1;
                let maxHp = Math.round(def.hp * bonusMult);
                let speed = def.speed;
                let attack = Math.round(def.attack * bonusMult);
                let range = def.range;
                let meleeArmor = def.meleeArmor || 0;
                let pierceArmor = def.pierceArmor || 0;
                let maxCarry = 15;

                // Civilization & Tech Bonuses
                if (faction === 'player') {
                    if (this.playerCiv === 'franks' && type === 'knight') {
                        maxHp = Math.round(maxHp * 1.2);
                    } else if (this.playerCiv === 'britons' && (type === 'archer' || type === 'skirmisher')) {
                        range += 30;
                        attack += 1;
                    } else if (this.playerCiv === 'teutons' && (type === 'militia' || type === 'spearman')) {
                        meleeArmor += 2;
                    } else if (this.playerCiv === 'mongols' && type === 'knight') {
                        speed = Math.round(speed * 1.2);
                    }

                    if (fState.techs && fState.techs.has('wheelbarrow') && type === 'villager') {
                        speed = Math.round(speed * 1.25);
                        maxCarry = 20;
                    }
                    if (fState.techs && fState.techs.has('forging') && ['militia', 'knight', 'spearman'].includes(type)) {
                        attack += 2;
                    }
                    if (fState.techs && fState.techs.has('iron_armor')) {
                        meleeArmor += 2;
                        pierceArmor += 2;
                    }
                    if (fState.techs && fState.techs.has('fletching') && ['archer', 'skirmisher'].includes(type)) {
                        attack += 2;
                        range += 25;
                    }
                }

                const u = {
                    id: this.idCounter++,
                    entityKind: 'unit',
                    type,
                    faction,
                    x, y,
                    radius: def.radius,
                    hp: maxHp,
                    maxHp,
                    speed,
                    attack,
                    range,
                    meleeArmor,
                    pierceArmor,
                    cooldown: def.cooldown,
                    attackTimer: 0,
                    state: 'idle',
                    targetX: x,
                    targetY: y,
                    targetEntityId: null,
                    path: [],
                    garrisoned: false,
                    chantTimer: 0,
                    previousState: null,
                    previousTargetEntityId: null,
                    carryType: null,
                    carryAmount: 0,
                    maxCarry,
                    facing: 1,
                    walkCycle: Math.random() * Math.PI * 2,
                    swingAnim: 0,
                    hurtFlash: 0
                };
                this.units.push(u);
                this.recalculatePop();
                return u;
            }

            recalculatePop() {
                this.factions.player.pop = this.units.filter(u => u.faction === 'player' && u.hp > 0).length;
                let maxP = 5;
                this.buildings.forEach(b => {
                    if (b.faction === 'player' && b.completed && b.hp > 0) {
                        maxP += BUILDINGS_DEF[b.type].popBonus || 0;
                    }
                });
                this.factions.player.maxPop = Math.min(60, maxP);
            }

            bindInputEvents() {
                window.addEventListener('blur', () => {
                    this.keys = {};
                });

                window.addEventListener('keydown', (e) => {
                    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;

                    const key = e.key.toLowerCase();
                    this.keys[key] = true;
                    this.keys[e.code] = true;

                    // Prevent browser scrolling on arrow keys or space
                    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(key)) {
                        e.preventDefault();
                    }

                    if (e.key === 'Escape') {
                        this.buildModeType = null;
                        this.updateSelectionUI();
                    } else if (e.key === '.' || e.key === ',' || e.code === 'Period' || e.code === 'Comma') {
                        e.preventDefault();
                        // Select ALL idle villagers (or idle military if no villagers are idle)
                        this.selectIdleVillager(e.key === ',' || e.code === 'Comma');
                    } else if (key === 'h' || e.key === ' ') {
                        this.centerOnTownCenter(true);
                    } else if (key === 'b') {
                        this.toggleTownBell();
                    } else if (key === 'z') {
                        this.cycleFormation();
                    } else if (key >= '1' && key <= '9') {
                        const num = key;
                        if (e.ctrlKey) {
                            e.preventDefault();
                            this.controlGroups[num] = Array.from(this.selectedIds);
                            this.sound.play('click');
                            this.showToast(`🚩 Kampfgruppe ${num} zugewiesen (${this.controlGroups[num].length} Einheiten)!`);
                        } else {
                            const grp = this.controlGroups[num];
                            if (grp && grp.length > 0) {
                                e.preventDefault();
                                const alive = this.units.filter(u => u.faction === 'player' && u.hp > 0 && grp.includes(u.id));
                                if (alive.length > 0) {
                                    this.selectedIds.clear();
                                    let sumX = 0, sumY = 0;
                                    alive.forEach(u => {
                                        this.selectedIds.add(u.id);
                                        sumX += u.x;
                                        sumY += u.y;
                                    });
                                    this.sound.play('click');
                                    this.updateSelectionUI();
                                    const now = performance.now();
                                    if (this._lastGroupPressNum === num && now - (this._lastGroupPressTime || 0) < 380) {
                                        this.centerCameraOn(sumX / alive.length, sumY / alive.length);
                                    }
                                    this._lastGroupPressNum = num;
                                    this._lastGroupPressTime = now;
                                }
                            }
                        }
                    } else if (key === 'f' || key === 'm') {
                        this.selectAllMilitary();
                    } else if (e.key === '+' || e.key === '=') {
                        this.camera.zoom = Math.min(1.75, this.camera.zoom * 1.12);
                    } else if (e.key === '-') {
                        this.camera.zoom = Math.max(0.45, this.camera.zoom * 0.9);
                    }
                });

                window.addEventListener('keyup', (e) => {
                    this.keys[e.key.toLowerCase()] = false;
                    this.keys[e.code] = false;
                });

                // Top & Left UI Buttons
                const btnCiv = document.getElementById('btnCiv');
                if (btnCiv) btnCiv.addEventListener('click', () => this.cycleCivilization());
                document.getElementById('btnAgeUp').addEventListener('click', () => this.tryAdvanceAge());
                document.getElementById('btnMusic').addEventListener('click', (e) => {
                    const on = this.sound.toggleMusic();
                    e.currentTarget.classList.toggle('active', on);
                    this.showToast(on ? '🎵 Mittelalter-Lautenmusik aktiviert' : '🎵 Musik pausiert');
                });
                document.getElementById('btnSound').addEventListener('click', (e) => {
                    this.sound.enabled = !this.sound.enabled;
                    e.currentTarget.classList.toggle('active', this.sound.enabled);
                    e.currentTarget.textContent = this.sound.enabled ? '🔊' : '🔇';
                });
                document.getElementById('btnRestart').addEventListener('click', () => this.initMatch());
                document.getElementById('btnModalRestart').addEventListener('click', () => this.initMatch());

                const btnBell = document.getElementById('btnTownBell');
                if (btnBell) btnBell.addEventListener('click', () => this.toggleTownBell());
                const btnFormation = document.getElementById('btnFormation');
                if (btnFormation) btnFormation.addEventListener('click', () => this.cycleFormation());
                document.getElementById('btnIdleVillager').addEventListener('click', () => this.selectIdleVillager(false));
                document.getElementById('btnSelectArmy').addEventListener('click', () => this.selectAllMilitary());
                document.getElementById('btnHomeTC').addEventListener('click', () => this.centerOnTownCenter(true));

                const setMode = (m) => {
                    this.touchMode = m;
                    this.buildModeType = null;
                    document.getElementById('modeCmd').classList.toggle('active', m === 'cmd');
                    document.getElementById('modeBox').classList.toggle('active', m === 'box');
                    document.getElementById('modeCam').classList.toggle('active', m === 'cam');
                    this.sound.play('click');
                };
                document.getElementById('modeCmd').addEventListener('click', () => setMode('cmd'));
                document.getElementById('modeBox').addEventListener('click', () => setMode('box'));
                document.getElementById('modeCam').addEventListener('click', () => setMode('cam'));

                // Canvas Mouse Events
                this.canvas.addEventListener('contextmenu', (e) => e.preventDefault());

                this.canvas.addEventListener('mousedown', (e) => {
                    this.sound.init();
                    const worldPos = this.screenToWorld(e.clientX, e.clientY);
                    if (e.button === 2) {
                        if (this.buildModeType) {
                            this.buildModeType = null;
                            return;
                        }
                        this.issueSmartCommand(worldPos.x, worldPos.y, e.clientX, e.clientY);
                        return;
                    }
                    this.pointer.down = true;
                    this.pointer.startX = this.pointer.curX = e.clientX;
                    this.pointer.startY = this.pointer.curY = e.clientY;
                    this.pointer.mode = e.button === 1 ? 'cam' : this.touchMode;
                });

                window.addEventListener('mousemove', (e) => {
                    const wPos = this.screenToWorld(e.clientX, e.clientY);
                    this.buildPreviewPos = wPos;
                    if (!this.pointer.down) return;

                    const dx = e.clientX - this.pointer.curX;
                    const dy = e.clientY - this.pointer.curY;
                    this.pointer.curX = e.clientX;
                    this.pointer.curY = e.clientY;
                    const dist = Math.hypot(this.pointer.curX - this.pointer.startX, this.pointer.curY - this.pointer.startY);

                    if (this.pointer.mode === 'cam') {
                        this.camera.x = Math.max(-2400, Math.min(2400, this.camera.x - dx / this.camera.zoom));
                        this.camera.y = Math.max(-200, Math.min(2600, this.camera.y - dy / this.camera.zoom));
                    } else if (dist > 14) {
                        this.isBoxSelecting = true;
                        this.boxSelectRect = {
                            x1: Math.min(this.pointer.startX, this.pointer.curX),
                            y1: Math.min(this.pointer.startY, this.pointer.curY),
                            x2: Math.max(this.pointer.startX, this.pointer.curX),
                            y2: Math.max(this.pointer.startY, this.pointer.curY)
                        };
                    }
                });

                window.addEventListener('mouseup', () => {
                    if (!this.pointer.down) return;
                    this.finishPointerInteraction();
                });

                this.canvas.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const factor = e.deltaY < 0 ? 1.12 : 0.9;
                    this.camera.zoom = Math.max(0.45, Math.min(1.75, this.camera.zoom * factor));
                }, { passive: false });

                // Canvas Touch Events
                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.sound.init();
                    if (e.touches.length === 2) {
                        this.pointer.mode = 'pinch';
                        this.pointer.pinchDist = Math.hypot(
                            e.touches[0].clientX - e.touches[1].clientX,
                            e.touches[0].clientY - e.touches[1].clientY
                        );
                        return;
                    }
                    const t = e.touches[0];
                    this.pointer.down = true;
                    this.pointer.startX = this.pointer.curX = t.clientX;
                    this.pointer.startY = this.pointer.curY = t.clientY;
                    this.pointer.mode = this.touchMode;
                    this.buildPreviewPos = this.screenToWorld(t.clientX, t.clientY);
                }, { passive: false });

                this.canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    if (e.touches.length === 2 && this.pointer.mode === 'pinch') {
                        const d = Math.hypot(
                            e.touches[0].clientX - e.touches[1].clientX,
                            e.touches[0].clientY - e.touches[1].clientY
                        );
                        if (this.pointer.pinchDist > 10) {
                            this.camera.zoom = Math.max(0.45, Math.min(1.75, this.camera.zoom * (d / this.pointer.pinchDist)));
                        }
                        this.pointer.pinchDist = d;
                        return;
                    }
                    if (!this.pointer.down || !e.touches.length) return;
                    const t = e.touches[0];
                    const dx = t.clientX - this.pointer.curX;
                    const dy = t.clientY - this.pointer.curY;
                    this.pointer.curX = t.clientX;
                    this.pointer.curY = t.clientY;
                    this.buildPreviewPos = this.screenToWorld(t.clientX, t.clientY);

                    const totalDist = Math.hypot(this.pointer.curX - this.pointer.startX, this.pointer.curY - this.pointer.startY);
                    if (this.pointer.mode === 'cam' || (this.pointer.mode === 'cmd' && totalDist > 18)) {
                        this.camera.x = Math.max(-2400, Math.min(2400, this.camera.x - dx / this.camera.zoom));
                        this.camera.y = Math.max(-200, Math.min(2600, this.camera.y - dy / this.camera.zoom));
                    } else if (this.pointer.mode === 'box' && totalDist > 14) {
                        this.isBoxSelecting = true;
                        this.boxSelectRect = {
                            x1: Math.min(this.pointer.startX, this.pointer.curX),
                            y1: Math.min(this.pointer.startY, this.pointer.curY),
                            x2: Math.max(this.pointer.startX, this.pointer.curX),
                            y2: Math.max(this.pointer.startY, this.pointer.curY)
                        };
                    }
                }, { passive: false });

                this.canvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    if (this.pointer.down) this.finishPointerInteraction();
                }, { passive: false });

                // Minimap Navigation (Isometric Diamond -> World Coordinates)
                const moveCamFromMinimap = (clientX, clientY) => {
                    const rect = this.miniCanvas.getBoundingClientRect();
                    const rx = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                    const ry = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));
                    // Unproject from isometric diamond on minimap
                    const nx = (rx - 0.5) * 2; // -1 .. 1
                    const ny = ry * 2;         // 0 .. 2
                    const wx = Math.max(0, Math.min(this.worldSize, ((nx + ny) * 0.5) * this.worldSize));
                    const wy = Math.max(0, Math.min(this.worldSize, ((ny - nx) * 0.5) * this.worldSize));
                    this.centerCameraOn(wx, wy);
                };
                this.miniCanvas.addEventListener('mousedown', (e) => moveCamFromMinimap(e.clientX, e.clientY));
                this.miniCanvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    moveCamFromMinimap(e.touches[0].clientX, e.touches[0].clientY);
                }, { passive: false });
                this.miniCanvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    moveCamFromMinimap(e.touches[0].clientX, e.touches[0].clientY);
                }, { passive: false });
            }

            finishPointerInteraction() {
                const dist = Math.hypot(this.pointer.curX - this.pointer.startX, this.pointer.curY - this.pointer.startY);
                if (this.isBoxSelecting && this.boxSelectRect) {
                    const r = this.boxSelectRect;
                    this.selectedIds.clear();
                    this.units.forEach(u => {
                        if (u.faction === 'player' && u.hp > 0) {
                            const sp = this.worldToScreen(u.x, u.y, 14);
                            if (sp.x >= r.x1 && sp.x <= r.x2 && sp.y >= r.y1 && sp.y <= r.y2) {
                                this.selectedIds.add(u.id);
                            }
                        }
                    });
                    if (this.selectedIds.size > 0) this.sound.play('click');
                    this.updateSelectionUI();
                } else if (dist <= 18 && this.pointer.mode !== 'pinch') {
                    const worldPos = this.screenToWorld(this.pointer.curX, this.pointer.curY);
                    this.handleWorldTap(worldPos.x, worldPos.y, this.pointer.curX, this.pointer.curY);
                }

                this.pointer.down = false;
                this.isBoxSelecting = false;
                this.boxSelectRect = null;
            }

            handleWorldTap(wx, wy, sx, sy) {
                if (this.buildModeType) {
                    this.tryPlaceBuilding(this.buildModeType, wx, wy);
                    return;
                }

                const clickedEntity = this.findEntityAt(wx, wy, sx, sy);
                const selectedPlayerUnits = this.getSelectedUnits();

                if (clickedEntity && clickedEntity.faction === 'player') {
                    // If villagers are selected and player taps an unfinished building or farm, send ALL selected villagers to work on it
                    if (
                        selectedPlayerUnits.some(u => u.type === 'villager') &&
                        clickedEntity.entityKind === 'building' &&
                        (!clickedEntity.completed || clickedEntity.isFarm)
                    ) {
                        this.issueSmartCommand(wx, wy, sx, sy);
                        return;
                    }

                    this.selectedIds.clear();
                    this.selectedIds.add(clickedEntity.id);
                    if (clickedEntity.type === 'towncenter') this.sound.play('bell');
                    else if (clickedEntity.type === 'knight') this.sound.play('horse');
                    else this.sound.play('click');
                    this.updateSelectionUI();
                    return;
                }

                if (selectedPlayerUnits.length > 0 || this.getSelectedBuilding()) {
                    this.issueSmartCommand(wx, wy, sx, sy);
                }
            }

            issueSmartCommand(wx, wy, sx, sy) {
                const selBld = this.getSelectedBuilding();
                if (selBld && selBld.faction === 'player') {
                    selBld.rallyX = Math.max(40, Math.min(this.worldSize - 40, wx));
                    selBld.rallyY = Math.max(40, Math.min(this.worldSize - 40, wy));
                    this.addCommandMarker(selBld.rallyX, selBld.rallyY, '#60a5fa');
                    this.sound.play('click');
                    return;
                }

                const selUnits = this.getSelectedUnits();
                if (selUnits.length === 0) return;

                const target = this.findEntityAt(wx, wy, sx, sy);

                if (target) {
                    // 1. Target is a Resource Node
                    if (target.entityKind === 'resource' && target.amount > 0 && selUnits.some(u => u.type === 'villager')) {
                        const villagers = selUnits.filter(u => u.type === 'villager');
                        const nearbyCluster = this.resources
                            .filter(r => r.amount > 0 && r.type === target.type && Math.hypot(r.x - target.x, r.y - target.y) <= 130)
                            .sort((a, b) => Math.hypot(a.x - target.x, a.y - target.y) - Math.hypot(b.x - target.x, b.y - target.y));

                        villagers.forEach((v, idx) => {
                            const assignedNode = nearbyCluster.length > 0
                                ? nearbyCluster[Math.floor(idx / 2) % nearbyCluster.length]
                                : target;
                            v.state = 'gather';
                            v.targetEntityId = assignedNode.id;
                            v.path = this.navGrid.findPath(v.x, v.y, assignedNode.x, assignedNode.y);
                        });
                        this.addCommandMarker(target.x, target.y, '#fbbf24');
                        this.sound.play('order');
                        if (target.type === 'wood') this.sound.speak('Holzfäller!');
                        else if (target.type === 'food') this.sound.speak('Sammler!');
                        else this.sound.speak('Bergmann!');
                        if (villagers.length > 1) {
                            this.showToast(`⛏️ ${villagers.length} Dorfbewohner sammeln nun gemeinsam!`);
                        }
                        return;
                    }

                    // 2. Target is a Player Building (Construct, Farm, or Garrison)
                    if (target.entityKind === 'building' && target.faction === 'player') {
                        if (!target.completed && selUnits.some(u => u.type === 'villager')) {
                            selUnits.filter(u => u.type === 'villager').forEach(v => {
                                v.state = 'build';
                                v.targetEntityId = target.id;
                                v.path = this.navGrid.findPath(v.x, v.y, target.x, target.y);
                            });
                            this.addCommandMarker(target.x, target.y, '#38bdf8');
                            this.sound.play('order');
                            this.sound.speak('Baumeister!');
                            return;
                        }
                        if (target.isFarm && selUnits.some(u => u.type === 'villager')) {
                            selUnits.filter(u => u.type === 'villager').forEach(v => {
                                v.state = 'gather_farm';
                                v.targetEntityId = target.id;
                                v.path = this.navGrid.findPath(v.x, v.y, target.x, target.y);
                            });
                            this.addCommandMarker(target.x, target.y, '#facc15');
                            this.sound.play('order');
                            this.sound.speak('Bauer!');
                            return;
                        }
                        if (target.completed && (target.type === 'towncenter' || target.type === 'tower' || target.type === 'castle')) {
                            this.garrisonUnitsInBuilding(selUnits, target);
                            this.addCommandMarker(target.x, target.y, '#3b82f6');
                            this.sound.play('bell');
                            this.sound.speak('Schutz suchen!');
                            return;
                        }
                    }

                    // 3. Target is Friendly Wounded Unit (Monk Heal)
                    if (target.entityKind === 'unit' && target.faction === 'player' && target.hp < target.maxHp) {
                        const monks = selUnits.filter(u => u.type === 'monk');
                        if (monks.length > 0) {
                            monks.forEach(m => {
                                m.state = 'heal';
                                m.targetEntityId = target.id;
                                m.path = this.navGrid.findPath(m.x, m.y, target.x, target.y);
                            });
                            this.addCommandMarker(target.x, target.y, '#34d399');
                            this.sound.play('heal');
                            this.sound.speak('Segnung!');
                            return;
                        }
                    }

                    // 4. Target is an Enemy (Attack or Monk Conversion)
                    if (target.faction === 'enemy') {
                        selUnits.forEach(u => {
                            if (u.type === 'monk') {
                                u.state = 'convert';
                                u.targetEntityId = target.id;
                                u.chantTimer = 0;
                                u.path = this.navGrid.findPath(u.x, u.y, target.x, target.y);
                            } else {
                                u.state = 'attack';
                                u.targetEntityId = target.id;
                                u.path = this.navGrid.findPath(u.x, u.y, target.x, target.y);
                            }
                        });
                        this.addCommandMarker(target.x, target.y, '#ef4444');
                        this.sound.play('attack_order');
                        if (selUnits.some(u => u.type === 'monk')) {
                            this.sound.play('wololo');
                            this.sound.speak('Wololo!');
                        } else {
                            this.sound.speak(Math.random() < 0.5 ? 'Angriff!' : 'Zu den Waffen!');
                        }
                        return;
                    }
                }

                // 5. Tactical Formation Ground Move with A* Pathfinding
                const count = selUnits.length;
                const form = this.activeFormation || 'box';

                if (form === 'line') {
